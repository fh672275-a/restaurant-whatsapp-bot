# Nixpacks configuration for Railway - Stable Build

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm install --omit=dev"]

[phases.build]
cmds = ["npm run build:sqlite || true"]

[phases.start]
cmd = "node --max-old-space-size=512 server.js"

[variables]
NODE_ENV = "production"
PORT = "${{PORT}}"
