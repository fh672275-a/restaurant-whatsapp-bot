# Nixpacks configuration for Railway
# This tells Railway how to build and run the app

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci --include=dev || npm install"]

[phases.build]
cmds = ["npm run build:sqlite"]

[phases.start]
cmd = "node server.js"

[variables]
NODE_ENV = "production"
PORT = "${{PORT}}"
